<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong — Structures Inspection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #dfe1e5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card-500 {
            background: #fff;
            border-radius: 16px;
            padding: 2rem 1.5rem;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 6px 24px rgba(0,0,0,0.12);
        }
        .btn { min-height: 3rem; font-weight: 600; }
    </style>
</head>
<body>
    <!--
      Deliberately standalone rather than extending base.html. A 500 can
      be caused by the database or the template layer itself, and a page
      that depends on either might fail to render too - leaving the user
      with a blank screen instead of an explanation.
    -->
    <div class="card-500">
        <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size:3rem"></i>
        <h5 class="fw-bold mt-3">Something went wrong</h5>
        <p class="text-muted small">
            The server hit an error handling that request. Any data you had
            already committed is safe on the server — only the current page
            failed.
        </p>
        <a href="/" class="btn btn-dark w-100 mt-2">
            <i class="bi bi-house me-1"></i>Back to the app
        </a>
    </div>
</body>
</html>
